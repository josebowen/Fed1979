<title>Fed1979</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-state="title">
<canvas id="gl" role="img" aria-label="Live 3D view of a boardroom at night. Twelve voting members of the Federal Open Market Committee sit at a table. A lit board on the table shows inflation, unemployment, the federal funds rate and the mortgage rate. The same information is available from the buttons and panel."></canvas>
<div id="labels"></div>
<div id="bubble" role="status" aria-live="polite"></div>

<main id="title">
  <div class="in">
    <p class="kick">Living history · monetary policy · college level</p>
    <h1>Fed<em>1979</em></h1>
    <p class="sub">Three real meetings. Real votes, real transcripts, real data. A debate that is still open.</p>
    <div class="row"><button class="btn pri big" data-act="begin">Enter the room</button><button class="btn" data-act="about">About this demo</button></div>
    <p class="foot">About 10 minutes · Sources: FOMC transcripts and records, Federal Reserve Board, FRED, St. Louis Fed · Best on a large screen</p>
  </div>
</main>

<header id="top">
  <span class="brand">Fed1979</span>
  <nav id="steps" aria-label="Go to a part of the game"><button data-nav="0">Briefing</button><button data-nav="1">Sept 1979</button><button data-nav="2">Oct 1979</button><button data-nav="3">July 1982</button><button data-nav="4">Debrief</button></nav>

  <div class="tools"><button class="btn sm" id="soundBtn" data-act="sound" aria-pressed="true">Sound on</button><button class="btn sm" data-act="about">About</button></div>
</header>

<aside id="panel" aria-label="Meeting panel"><div id="panelBody" aria-live="polite"></div></aside>
<div id="caption" role="status"></div>
<section id="card" role="dialog" aria-labelledby="cardH" hidden><button class="btn sm" id="cardClose" data-act="closeCard">Close</button><div id="cardBody"></div></section>

</div>
