<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fed1979</title>
<meta name="description" content="Sit in on three real Federal Reserve meetings from 1979 to 1982. Read the transcripts, predict the votes, make your own call, and weigh a debate economists still have not settled.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#04060c;--ink:#f3eee4;--mute:#b9b2a3;--line:rgba(226,184,110,.22);--glass:rgba(9,12,22,.78);--cy:#e8bd6a;--blue:#9fc0ff;--amber:#ffb24d;--gold:#ffd75a;--red:#ff6b6b;--ok:#6ff0b0;--disp:"Fraunces",Georgia,serif;--ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--pw:420px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;cursor:grab}#gl:active{cursor:grabbing}
button{font:inherit;color:inherit}a{color:var(--cy)}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
h2:focus{outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;white-space:nowrap;font:600 13px var(--ui);letter-spacing:.02em;padding:5px 11px;border-radius:999px;background:rgba(8,10,18,.72);border:1px solid var(--line);color:var(--ink);opacity:0;transition:opacity .5s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lab.small{font-size:11.5px;font-weight:500;color:#ece4d4}.lab.zone{background:none;border:none;backdrop-filter:none;-webkit-backdrop-filter:none;font:italic 500 17px var(--disp);color:rgba(243,236,220,.8);text-shadow:0 1px 10px #000}
.lab.macro{font-size:14px}
#heat{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 40% 55%,rgba(255,90,40,0) 30%,rgba(255,70,30,.55) 100%);mix-blend-mode:screen}
#flash{position:fixed;inset:0;background:radial-gradient(circle,#eaffff 0%,#7ff0ff 35%,#0b5a6b 100%);opacity:0;pointer-events:none;transition:opacity .9s}
[data-state=descent] #flash{transition:none}
/* title */
#title{position:fixed;inset:0;display:none;align-items:center;padding:6vh 6vw;pointer-events:none;background:linear-gradient(90deg,rgba(4,6,12,.86) 0%,rgba(4,6,12,.5) 38%,rgba(4,6,12,0) 62%)}
[data-state=title] #title{display:flex}
#title .in{max-width:min(46vw,640px);pointer-events:auto}
.kick{font:600 12px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--cy);margin:0 0 10px}
.kick.alert{color:#ff9a8a}
h1{font:600 clamp(40px,5.6vw,88px)/.98 var(--disp);letter-spacing:-.015em;margin:0 0 22px;text-wrap:balance}
h1 em{font-style:italic;font-weight:500;color:var(--gold)}
#title p.sub{font:400 clamp(17px,1.5vw,22px)/1.45 var(--ui);color:#e9e2d2;margin:0 0 30px;max-width:30em}
#title .foot{margin-top:26px;font-size:13.5px;color:var(--mute)}
.btn{border:1px solid var(--line);background:rgba(232,189,106,.08);border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;cursor:pointer;transition:background .2s,transform .15s,border-color .2s}
.btn:hover{background:rgba(232,189,106,.18);border-color:rgba(232,189,106,.45)}.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#f7d891,#d9a548);color:#1d1404;border-color:transparent;box-shadow:0 6px 30px rgba(230,170,70,.28)}
.btn.pri:hover{background:linear-gradient(180deg,#fbe4ac,#e4b35a)}
.btn.pri:disabled{background:rgba(232,189,106,.14);color:#a99f8a;box-shadow:none;cursor:not-allowed}
.btn.big{font-size:18px;padding:15px 30px}.btn.ghost{background:none}.btn.sm{font-size:13px;padding:7px 14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
/* top bar */
#top{position:fixed;left:0;top:0;right:0;display:none;align-items:center;gap:18px;padding:14px 20px;pointer-events:none}
[data-state]:not([data-state=title]):not([data-state=descent]) #top{display:flex}
#top>*{pointer-events:auto}
.brand{font:600 17px var(--disp);letter-spacing:.005em;white-space:nowrap;text-shadow:0 1px 12px #000}
#steps{list-style:none;display:flex;gap:6px;margin:0;padding:0}
#steps li{font:600 11.5px var(--ui);letter-spacing:.04em;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mute);background:rgba(8,10,18,.6)}
#steps li.cur{background:var(--cy);color:#1d1404;border-color:transparent}#steps li.done{color:var(--ok);border-color:rgba(111,240,176,.4)}
#top .sp{flex:1}
#top .tools{display:flex;gap:8px;margin-right:calc(var(--pw) + 24px)}
#skip{position:fixed;right:24px;bottom:24px;display:none}[data-state=descent] #skip{display:block}
/* hud */
#hud{position:fixed;left:20px;top:62px;width:min(430px,calc(100vw - var(--pw) - 70px));display:none;padding:14px 16px 12px;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
[data-state]:not([data-state=title]):not([data-state=descent]) #hud{display:block}
#gauges{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.gl{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:#e6dece;margin-bottom:5px}
.gl b{font:600 17px var(--ui);font-variant-numeric:tabular-nums;color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.bar{position:relative;height:7px;border-radius:99px;background:rgba(232,210,170,.14)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;width:0;transition:width .15s linear}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.75);border-radius:2px}
#chart{width:100%;height:74px;margin-top:12px;display:block}
.hudfoot{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px;color:var(--mute);margin-top:8px;padding-top:9px;border-top:1px solid rgba(232,189,106,.12)}
.hudfoot b{color:var(--gold);font-variant-numeric:tabular-nums}
.cyto{display:flex;align-items:center;gap:8px}.lac{width:54px;height:6px;border-radius:9px;background:rgba(232,210,170,.14);overflow:hidden}.lac i{display:block;height:100%;width:0;background:#c79bff;transition:width .3s}
.tick{font-size:11px;color:var(--mute);margin-top:6px}
/* panel */
#panel{position:fixed;right:20px;top:20px;bottom:20px;width:var(--pw);display:none;overflow:auto;border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 80px rgba(0,0,0,.45)}
[data-state]:not([data-state=title]):not([data-state=descent]) #panel{display:block}
#panelBody{padding:26px 26px 24px}
#panel h2{font:600 30px/1.08 var(--disp);margin:0 0 14px;text-wrap:balance}
#panel h3{font:600 12px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:22px 0 10px}
#panel p,#panel li{font-size:15.5px;line-height:1.55;color:#ece5d6}
#panel p{margin:0 0 12px}
.mis{border-left:3px solid var(--amber);padding:9px 12px;background:rgba(255,178,77,.09);border-radius:0 10px 10px 0}
.beyond{border-left:3px solid #c79bff;padding:9px 12px;background:rgba(199,155,255,.09);border-radius:0 10px 10px 0;font-size:14px!important}
.src{font-size:12.5px!important;color:var(--mute)!important;margin-top:14px!important}.cite{white-space:nowrap}
.hint{font-size:13px!important;color:var(--mute)!important}
fieldset.q{border:0;padding:0;margin:0 0 14px}fieldset.q legend{font-weight:600;font-size:14.5px;margin-bottom:7px;padding:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{position:relative;display:block}.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:6px 8px;border-radius:12px;border:1px solid var(--line);font-size:13.5px;font-weight:500;line-height:1.2;background:rgba(232,189,106,.05)}
.seg input:checked+span{background:var(--cy);color:#1d1404;border-color:transparent;font-weight:700}.seg input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}
.prog{height:6px;border-radius:9px;background:rgba(232,210,170,.14);overflow:hidden;margin:6px 0 16px}.prog i{display:block;height:100%;width:0;background:var(--cy)}
.log{list-style:none;padding:0;margin:0 0 12px}.log li{padding:9px 0;border-bottom:1px solid rgba(232,189,106,.1);animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.verdict,.obj{list-style:none;padding:0;margin:0 0 16px}
.verdict li,.obj li{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(232,189,106,.1)}
.mark{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:rgba(232,210,170,.14);color:var(--mute)}
li.ok .mark{background:var(--ok);color:#04261a}li.no .mark{background:var(--red);color:#2b0606}
.verdict small,.obj small{display:block;color:var(--mute);font-size:12.5px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}th,td{padding:7px 6px;text-align:right;border-bottom:1px solid rgba(232,189,106,.12)}th:first-child{text-align:left}thead th{color:var(--mute);font-weight:600;font-size:11.5px}
.sl{display:block;margin:0 0 14px}.sl>span{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px}.sl b{font-variant-numeric:tabular-nums;color:var(--cy)}
input[type=range]{width:100%;accent-color:var(--cy);height:24px;margin:0}
.tg{display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600;margin:0 0 12px;cursor:pointer;position:relative}
.tg input{position:absolute;opacity:0;width:46px;height:26px;margin:0;cursor:pointer}.sw{flex:none;width:46px;height:26px;border-radius:99px;background:rgba(232,210,170,.18);border:1px solid var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.tg input:checked+.sw{background:var(--red)}.tg input:checked+.sw::after{transform:translateX(20px)}.tg input:focus-visible+.sw{outline:2px solid var(--cy);outline-offset:2px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}.chip:hover{background:rgba(232,189,106,.14)}
.try{padding-left:18px;margin:0}.try li{font-size:14px!important;margin-bottom:6px}
/* caption */
#caption{position:fixed;left:calc((100vw - var(--pw) - 40px)/2);bottom:34px;transform:translateX(-50%);max-width:min(720px,calc(100vw - var(--pw) - 120px));text-align:center;font:500 clamp(18px,1.7vw,26px)/1.3 var(--disp);padding:10px 22px;border-radius:16px;background:rgba(8,10,18,.72);border:1px solid var(--line);opacity:0;transition:opacity .4s;pointer-events:none;text-wrap:balance}
#caption.on{opacity:1}
[data-state=descent] #caption{left:50%;top:auto;bottom:11vh;max-width:min(820px,88vw);font-size:clamp(20px,2vw,30px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 180px 30px rgba(255,60,60,0);transition:box-shadow .6s}
body.alarm::after{animation:alarm 1.3s 2}
@keyframes alarm{50%{box-shadow:inset 0 0 180px 30px rgba(255,60,60,.5)}}
/* modal */
#modal{position:fixed;inset:0;background:rgba(2,3,8,.72);display:grid;place-items:center;padding:20px;z-index:20;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}#modal[hidden]{display:none}
#modal .card{width:min(760px,100%);max-height:88vh;overflow:auto;background:#0b0f1c;border:1px solid var(--line);border-radius:22px;padding:30px 32px;position:relative}
#modal h2{font:600 30px var(--disp);margin:0 0 12px}#modal h3{font:600 12px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--cy);margin:22px 0 8px}
#modal p,#modal li{font-size:15px;line-height:1.55;color:#ece5d6}#modal ul{padding-left:20px;margin:0}#modal li{margin-bottom:6px}
#modal pre{font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.3);padding:14px;border-radius:12px;overflow:auto;color:#ece5d6}
#modalClose{position:sticky;top:0;float:right;margin:-8px -10px 0 12px}
@media (max-width:819px){
 :root{--pw:0px}
 #title{align-items:flex-end;padding:0 22px 34px;background:linear-gradient(0deg,rgba(4,6,12,.94) 0%,rgba(4,6,12,.7) 40%,rgba(4,6,12,0) 66%)}#title .in{max-width:100%}
 h1{font-size:clamp(34px,10.5vw,54px);margin-bottom:14px}#title p.sub{font-size:16px;margin-bottom:20px}.btn.big{font-size:16px;padding:13px 24px}
 #top{padding:8px 10px;gap:8px}.brand{display:none}#steps{gap:4px}#steps li{padding:0;width:22px;height:22px;font-size:0;border-radius:50%}#steps li.cur{width:auto;height:22px;padding:4px 10px;font-size:10.5px;border-radius:99px;white-space:nowrap}#top .tools{margin-right:0;gap:5px}#top .btn.sm{padding:5px 9px;font-size:11px;white-space:nowrap}
 #hud{left:8px;right:8px;top:46px;bottom:auto;width:auto;padding:9px 12px;border-radius:14px}#gauges{grid-template-columns:repeat(4,1fr);gap:8px}.gl{flex-direction:column;gap:1px;font-size:10px;margin-bottom:4px}.gl b{font-size:14px}.dot{width:6px;height:6px;margin-right:4px}
 #chart,.tick{display:none}.hudfoot{font-size:10.5px;margin-top:7px;padding-top:6px}
 #panel{left:0;right:0;bottom:0;top:auto;width:auto;max-height:46vh;max-height:46dvh;border-radius:20px 20px 0 0;border-bottom:0}#panelBody{padding:18px 18px 22px}
 #panel h2{font-size:23px;margin-bottom:10px}#panel p,#panel li{font-size:14.5px}
 #caption{left:50%;top:auto;bottom:calc(46dvh + 10px);max-width:92vw;font-size:15px;padding:7px 12px}
 .lab{font-size:11px;padding:3px 8px}.seg span{font-size:12.5px;min-height:46px}
 #modal .card{padding:22px 20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* The Committee additions */
#skip{display:none!important}
.gl small{display:block;font-size:10.5px;color:var(--mute);font-weight:500}
.fredid{font-size:10.5px;color:var(--mute);text-decoration:none;border-bottom:1px dotted rgba(232,210,170,.4)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--mute);margin-top:6px}.legend i{display:inline-block;width:14px;height:2px;margin-right:5px;vertical-align:middle}.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important;height:2px}
.qtr{font:600 12px var(--ui);letter-spacing:.08em;color:var(--cy)}
.who{display:flex;gap:11px;align-items:flex-start;margin:4px 0 10px}.who .sw2{flex:none;width:10px;height:38px;border-radius:4px}.who b{display:block;font-size:15px}.who small{display:block;font-size:12.5px;color:var(--mute)}
.prop{font:500 19px/1.35 var(--disp);padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(232,189,106,.07);margin:0 0 14px}
.seg.two{grid-template-columns:1fr 1fr}.seg.one{grid-template-columns:1fr}
.seg.one span,.cards span{justify-content:flex-start;text-align:left;padding:10px 12px;font-size:14px;line-height:1.4}
.member{border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px;margin:0 0 14px;background:rgba(255,255,255,.02)}
.member .say{font-size:15px;margin:2px 0 6px}.member .data{font-size:12px;color:var(--mute);margin:0 0 10px}
.badge{display:inline-flex;align-items:center;gap:5px;font:700 11.5px var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.badge.yes{background:rgba(111,240,176,.14);color:#9ff5c6;border-color:rgba(111,240,176,.4)}.badge.no{background:rgba(255,120,110,.12);color:#ffb1a8;border-color:rgba(255,120,110,.4)}
.fb{font-size:13.5px!important;margin:8px 0 0!important;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04)}.fb.ok{border-left:3px solid var(--ok)}.fb.no{border-left:3px solid var(--red)}
.tally{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 14px}.tally div{text-align:center;padding:8px 4px;border-radius:12px;border:1px solid var(--line);font-size:11.5px;line-height:1.3}.tally b{display:block;font-size:13px}
.result{font:600 20px/1.3 var(--disp);margin:0 0 12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}.cmp>div{border:1px solid var(--line);border-radius:14px;padding:11px 12px}.cmp h4{margin:0 0 6px;font:600 11.5px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--cy)}.cmp p{font-size:13.5px!important;margin:0 0 6px!important}
.kv{display:grid;grid-template-columns:auto auto;gap:2px 10px;font-size:13px;font-variant-numeric:tabular-nums}.kv span:nth-child(even){text-align:right;font-weight:600}
#ochart{width:100%;height:150px;display:block;margin:6px 0 4px}
.link{padding:8px 0;border-bottom:1px solid rgba(232,189,106,.1);font-size:13.5px}.link b{font-size:14px}.link .st{float:right;font:700 11px var(--ui);letter-spacing:.05em;text-transform:uppercase}
.st.held{color:#9ff5c6}.st.mixed{color:#ffd27a}.st.broke{color:#ffb1a8}.st.model{color:var(--blue)}
.dir{font-weight:700;white-space:nowrap}
.scorebar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.scorebar span{font-size:12.5px;padding:5px 10px;border-radius:99px;border:1px solid var(--line)}
@media (max-width:819px){
 #gauges{grid-template-columns:repeat(3,1fr)}.gl small{display:none}.legend{display:none}
 .cmp{grid-template-columns:1fr}.tally{grid-template-columns:repeat(5,1fr)}.tally div{font-size:10px;padding:6px 2px}
 .prop{font-size:16px}
}

.btn{white-space:nowrap}
/* Fed1979 additions */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg.three{grid-template-columns:repeat(3,1fr)}.seg.three span{font-size:12.5px;line-height:1.25;padding:8px 6px}
.roll{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 12px}
.roll div{padding:7px 6px;border-radius:10px;border:1px solid var(--line);text-align:center;background:rgba(255,255,255,.02)}
.roll b{display:block;font-size:13px}.roll small{display:block;font-size:10.5px;color:var(--mute);line-height:1.2}
.roll .maj{border-color:rgba(127,224,168,.45)}.roll .tight{border-color:rgba(255,138,92,.6);background:rgba(255,138,92,.08)}.roll .easy{border-color:rgba(143,180,255,.6);background:rgba(143,180,255,.08)}
.roll .you{box-shadow:0 0 0 2px #e8bd6a inset}
.badge.maj{background:rgba(127,224,168,.14);color:#a9f0c8;border-color:rgba(127,224,168,.4)}.badge.tight{background:rgba(255,138,92,.14);color:#ffbe9f;border-color:rgba(255,138,92,.45)}.badge.easy{background:rgba(143,180,255,.14);color:#c2d5ff;border-color:rgba(143,180,255,.45)}
.pos{display:grid;gap:8px;margin:6px 0 12px}.pos div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.025)}.pos b{font:600 15px var(--disp)}.pos p{margin:4px 0;font-size:13.5px}
.contest{border-left:3px solid #e8bd6a;padding:8px 12px;background:rgba(232,189,106,.07);border-radius:8px;font-size:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-size:13.5px;margin:8px 0 4px}.kv span:nth-child(even){font-weight:700;text-align:right}
.lab.seat{font-size:11px;padding:2px 7px}.lab.seat .badge{font-size:9.5px;padding:1px 5px;margin-left:4px}
.srcs li{font-size:13px;margin:0 0 4px}

.pos{grid-template-columns:minmax(0,1fr)}.pos div,.member{min-width:0}.src,.src .cite,.pos .cite{white-space:normal;overflow-wrap:anywhere}

/* ---------- November 12 rework: larger type, speech bubbles, cards, navigation ---------- */
:root{--pw:clamp(440px,35vw,600px)}
body[data-step=contest]{--pw:clamp(520px,46vw,780px)}
#panelBody{padding:26px 28px 26px}
#panel h2{font-size:clamp(28px,2.3vw,40px);line-height:1.1}
#panel h3{font-size:14px;margin:22px 0 10px}
#panel p,#panel li{font-size:clamp(17px,1.22vw,20px);line-height:1.5}
.prop{font-size:clamp(19px,1.45vw,24px);padding:14px 16px}
.hint{font-size:clamp(15px,1.02vw,17px)!important}
.src{font-size:13.5px!important}
.fb{font-size:clamp(16.5px,1.16vw,19px)!important;padding:12px 14px;margin:12px 0 0!important}
.seg span,.seg.one span,.cards span{font-size:clamp(16.5px,1.16vw,19px);min-height:54px;padding:10px 14px}
.kick{font-size:13px}.count{font:600 14px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 4px!important}
.btn{font-size:17px;padding:13px 22px}.btn.sm{font-size:14px;padding:8px 15px}
.pos b{font-size:19px}.pos p{font-size:clamp(16px,1.1vw,18px)!important}.member .say{font-size:clamp(17px,1.2vw,20px)}
.contest{font-size:clamp(16px,1.1vw,18px)!important}
.roll b{font-size:16px}.roll small{font-size:12.5px}
#steps{display:flex;gap:6px}
#steps button{font:600 13.5px var(--ui);letter-spacing:.03em;padding:7px 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:rgba(8,10,18,.7);cursor:pointer;white-space:nowrap}
#steps button:hover{border-color:var(--cy)}#steps button.cur{background:var(--cy);color:#1d1404;border-color:transparent}#steps button.done{color:var(--ok);border-color:rgba(111,240,176,.4)}
.stages{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 18px}
.stages button{font:600 12.5px var(--ui);padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.stages button.cur{background:rgba(232,189,106,.22);border-color:var(--cy)}.stages button:disabled{color:#7f796d;border-color:rgba(226,184,110,.1);cursor:default}
.stages button:not(:disabled):hover{border-color:var(--cy)}
#labels{pointer-events:none}
.lab.seat{font:600 15px var(--ui);padding:5px 11px 6px;text-align:center;line-height:1.15;cursor:pointer;border-radius:12px;background:rgba(8,10,18,.82)}
.lab.seat b{display:block}.lab.seat small{display:block;font:600 11.5px var(--ui);margin-top:2px}
.lab.seat small.maj{color:#8ff0b8}.lab.seat small.tight{color:#ffb08a}.lab.seat small.easy{color:#b3ccff}
.lab.seat:hover,.lab.seat.speaking{border-color:#ffd58a;box-shadow:0 0 0 2px rgba(255,213,138,.35)}
#bubble{position:fixed;left:0;top:0;max-width:min(640px,calc(100vw - var(--pw) - 90px));padding:18px 24px 16px;border-radius:20px;background:#f7f1e3;color:#1c160b;box-shadow:0 18px 60px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .35s;z-index:3}
#bubble.on{opacity:1}
#bubble::after{content:"";position:absolute;left:var(--tail,50%);bottom:-20px;margin-left:-14px;border:14px solid transparent;border-top:22px solid #f7f1e3;border-bottom:0}
#bubble p{margin:0}.bwho{font:500 15px var(--ui);color:#5b4a2a;margin-bottom:6px!important}.bwho b{font-size:17px;color:#1c160b}.bwho small{font-size:14px}
.bsay{font:500 clamp(22px,2vw,34px)/1.25 var(--disp);text-wrap:pretty}.bsrc{font:500 12.5px var(--ui);color:#6b5a3a;margin-top:10px!important}
#card{position:fixed;left:calc((100vw - var(--pw) - 40px)/2);top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100vw - var(--pw) - 90px));max-height:86vh;overflow:auto;padding:28px 32px;border-radius:22px;background:rgba(10,13,24,.96);border:1px solid var(--cy);box-shadow:0 30px 100px rgba(0,0,0,.7);z-index:6}
#card[hidden]{display:none}#cardClose{float:right;margin:-6px -8px 0 12px}
#card h2{font:600 clamp(30px,2.6vw,44px)/1.08 var(--disp);margin:0 0 6px}#card h2:focus{outline:none}
#card h3{font:600 13.5px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:22px 0 10px}
#card p,#card li{font-size:clamp(17px,1.25vw,20px);line-height:1.5;color:#efe8da;margin:0 0 12px}
#card .role{color:var(--cy);font-weight:600}
#card blockquote{margin:0 0 14px;padding:12px 16px;border-left:3px solid var(--cy);background:rgba(232,189,106,.07);border-radius:0 12px 12px 0;font:500 clamp(18px,1.4vw,23px)/1.35 var(--disp)}
#card blockquote cite{display:block;font:500 13px var(--ui);margin-top:8px;font-style:normal}
.votes,.recap{list-style:none;padding:0;margin:0 0 14px}.votes li,.recap li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(232,189,106,.14);margin:0!important}
.votes small{display:block;font-size:14.5px;color:var(--mute)}.votes li.yes .mark,.recap li.ok .mark{background:var(--ok);color:#04261a}.votes li.no .mark,.recap li.no .mark{background:#ff8a5c;color:#2b0d02}
#cardChart{width:100%;height:230px;display:block;margin:6px 0 12px}
#card .kv{font-size:17px}
.legendline{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:15px!important}
.legendline span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px}
.legendline .maj::before{background:#6fdc9c}.legendline .tight::before{background:#ff8a5c}.legendline .easy::before{background:#8fb4ff}
#caption{bottom:28px;font-size:clamp(20px,1.9vw,30px)}
/* debrief uses the whole screen */
body[data-state=debrief]{--pw:0px}
body[data-state=debrief] #panel{left:20px;right:20px;top:62px;width:auto;background:rgba(7,9,17,.9)}
body[data-state=debrief] #top .tools{margin-right:0}
.deb{display:grid;grid-template-columns:1fr 1fr;gap:10px 48px;max-width:1500px;margin:0 auto;padding:1vh 2vw}
.debhead{grid-column:1/-1}.deb h2{font-size:clamp(36px,3.4vw,60px)!important;margin-bottom:18px!important}
.deb p,.deb li,.deb td,.deb th{font-size:clamp(18px,1.4vw,24px)!important;line-height:1.45}
.deb h3{font-size:15px!important}.deb .try li{margin-bottom:14px}
.deb table{font-size:inherit}.deb td,.deb th{padding:12px 10px;text-align:left;vertical-align:top}
.scorebar{gap:14px}.scorebar span{font-size:clamp(17px,1.3vw,22px);padding:14px 22px;border-radius:18px;text-align:center;min-width:180px}
.scorebar b{font:600 clamp(34px,3vw,54px) var(--disp);color:var(--cy)}.scorebar small{display:block;color:var(--mute);font-size:clamp(14px,1vw,17px)}
button.link{background:none;border:0;border-bottom:1px solid var(--cy);padding:0;color:var(--cy);font:inherit;cursor:pointer;float:none;text-transform:none;letter-spacing:0}
@media (max-width:1320px) and (min-width:820px){.brand{display:none}#steps button{padding:6px 10px;font-size:12.5px}}
@media (max-width:819px){
 :root,body[data-step=contest]{--pw:0px}
 #panelBody{padding:16px 16px 20px}#panel h2{font-size:23px}#panel p,#panel li{font-size:15.5px}.prop{font-size:16.5px}.seg span,.seg.one span,.cards span{font-size:15px;min-height:46px}
 .btn{font-size:15px;padding:11px 16px}.fb{font-size:15px!important}
 #steps{gap:3px}#steps button{padding:4px 7px;font-size:10.5px}#top .tools{margin-right:0}
 .lab.seat{font-size:9.5px;padding:2px 4px}.lab.seat small{font-size:8px}
 #bubble{max-width:calc(100vw - 16px);padding:10px 14px}.bsay{font-size:17px}.bwho b{font-size:14px}
 #card{left:50%;width:calc(100vw - 16px);padding:18px}
 .deb{grid-template-columns:1fr;gap:6px}body[data-state=debrief] #panel{left:0;right:0;top:44px;bottom:0;max-height:none}
 .scorebar span{min-width:0;flex:1;padding:8px}
}
fieldset.q legend{font-size:clamp(16px,1.15vw,19px);margin-bottom:9px}
.lab.seat small{font-size:12.5px}
.deb table th:first-child{white-space:nowrap}

@media (max-width:819px){.lab.seat small{font-size:7.5px}.lab.seat{font-size:9px;padding:2px 3px}#caption{display:none}}
</style>
</head>
<body data-state="title">
<canvas id="gl" role="img" aria-label="Live 3D view of a boardroom at night. Twelve voting members of the Federal Open Market Committee sit at a table. A lit board on the table shows inflation, unemployment, the federal funds rate and the mortgage rate. The same information is available from the buttons and panel."></canvas>
<div id="labels"></div>
<div id="bubble" role="status" aria-live="polite"></div>

<main id="title">
  <div class="in">
    <p class="kick">Living history · monetary policy · college level</p>
    <h1>Fed<em>1979</em></h1>
    <p class="sub">Three real meetings. Real votes, real transcripts, real data. A debate that is still open.</p>
    <div class="row"><button class="btn pri big" data-act="begin">Enter the room</button><button class="btn" data-act="about">About this demo</button></div>
    <p class="foot">About 10 minutes · Sources: FOMC transcripts and records, Federal Reserve Board, FRED, St. Louis Fed · Best on a large screen</p>
  </div>
</main>

<header id="top">
  <span class="brand">Fed1979</span>
  <nav id="steps" aria-label="Go to a part of the game"><button data-nav="0">Briefing</button><button data-nav="1">Sept 1979</button><button data-nav="2">Oct 1979</button><button data-nav="3">July 1982</button><button data-nav="4">Debrief</button></nav>
  <span class="sp"></span>
  <div class="tools"><button class="btn sm" id="soundBtn" data-act="sound" aria-pressed="true">Sound on</button><button class="btn sm" data-act="about">About</button></div>
</header>

<aside id="panel" aria-label="Meeting panel"><div id="panelBody" aria-live="polite"></div></aside>
<div id="caption" role="status"></div>
<section id="card" role="dialog" aria-labelledby="cardH" hidden><button class="btn sm" id="cardClose" data-act="closeCard">Close</button><div id="cardBody"></div></section>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="aboutH" hidden>
  <div class="card"><button class="btn sm" id="modalClose" data-act="closeAbout">Close</button><div id="aboutBody"></div></div>
</div>

e"],balles:["John Balles","President, San Francisco Fed"],black:["Robert Black","President, Richmond Fed"],kimbrel:["Monroe Kimbrel","President, Atlanta Fed"],mayo:["Robert Mayo","President, Chicago Fed"],martin:["Preston Martin","Vice Chairman, Board"],gramley:["Lyle Gramley","Governor"],solomon:["Anthony Solomon","President, New York Fed"],ford:["William Ford","President, Atlanta Fed"],keehn:["Silas Keehn","President, Chicago Fed, voting alternate"]};var Ru=[["tight","Against: wanted firmer"],["maj","Voted for the motion"],["easy","Against: wanted easier"]],uc={title:"Three meetings, one argument",body:`<p>August 1979. Consumer prices are up 11.8 percent from a year earlier. Paul Volcker has been Fed chairman for six weeks. The economy may already be sliding into recession.</p>
  <p>You sit along the wall as a staff economist. The twelve voting members at the table are real people, and every vote you will see is the real roll call. Before each vote you read the record, predict how the room splits, and make your own recommendation. Then the room votes as it really did.</p>

 today would touch inflation within six to nine months.",coldwell:"Coldwell, Black and Balles agreed with a small rise but wanted room to go to 12 percent if money kept growing.",black:"Black tied policy to the money aggregates, a view that would win the day three weeks later."},predict:[["8 to 4, three wanting firmer policy and one wanting none",!0],["8 to 4, with all four dissenters wanting a firmer policy",!1],["12 to 0, every voting member backing a small rise",!1],["7 to 5, with five dissenters wanting no rise at all",!1]],predictFb:"The directive passed 8 to 4, with dissents from both directions. The same afternoon the Board raised the discount rate to 11 percent by 4 to 3: Volcker, Schultz, Wallich and Coldwell for; Partee, Teeters and Rice against.",predictCites:["r0918","ar79"],calls:[["Firm a little: funds rate to about 11.5%, discount rate to 11%","maj"],["Firm more: let the funds rate climb to 12% if money keeps growing","tight"],["Stand pat: hold the funds rate where it is and wait for data","easy"]],extraVote:{label:"Board of Governors, discount rate to 11 percent",tally:"4 to 3",yes:["volcker","schultz","wallich","coldwell"],no:["partee","teeters","rice"],cite:"ar79"},after:`<p>Two votes on one day, both split. The Board's 4 to 3 discount vote was public. Over the next three weeks gold and other commodities surged and the dollar fell. At the Saturday meeting that followed, Governor Partee described a mood of wanting "to get into goods and out of money."</p>`,afterCites:["t1006","lor"],events:{20:"September 18: the directive passes 8 to 4; the discount rate rises 4 to 3.",21:"Early October: gold, silver and copper surge. Volcker flies home early from the IMF meetings in Belgrade and calls a Saturday meeting."},contest:{q:"Did the split votes make things worse?",positions:[["Signal","Small, split moves told markets the Fed lacked resolve, and the reaction in gold and the dollar forced a bigger break within three weeks.",["lor","gk"]],["Prudence","A recession was forecast and policy works with long lags. Waiting for evidence was a defensible reading of the data in hand.",["r0918","t0918"]]],evidence:[["Real retail sales had been falling since May and industrial production had turned down.",1,"Rice cited these in the meeting. They speak to the recession risk, which is the prudence case."],["Within three weeks gold, silver and copper prices surged and the dollar weakened.",0,"Market moves after the vote are what the signal argument rests on. They do not prove the votes caused them."]]}},{id:"s2",short:"Oct 1979",date:"Saturday, October 6, 1979",m:21,dm:20,runTo:53,cpiNote:"September",title:"Change the method?",setting:`<p>The meeting is called on a weekend and kept quiet. Volcker reports that markets are as nervous as he has ever seen them: the rumors on Friday were "first that I had resigned and then that I had died."</p>
    <p>On the table is a change of method. Instead of setting the funds rate, the Desk would aim at a path for bank reserves consistent with the money targets, and let the funds rate go where the market takes it, within a wide range.</p>`,question:"The motion: target bank reserves, let the funds rate move between 11.5 and 15.5 percent, raise the discount rate to 12 percent, and add an 8 percent marginal reserve requirement.",members:["volcker","schultz","wallich","coldwell","partee","teeters","rice","black","balles","kimbrel","mayo","timlen"],votes:{volcker:"maj",schultz:"maj",wallich:"maj",coldwell:"maj",partee:"maj",teeters:"maj",rice:"maj",black:"maj",balles:"maj",kimbrel:"maj",mayo:"maj",timlen:"maj"},tally:"12 to 0",sortTitle:"Reasons and risks",sortHint:"Volcker laid out both sides himself. Sort each line: is it a reason to switch methods, or a risk of switching?",sortOpts:[["for","A reason to switch"],["risk","A risk of switching"]],quotes:[["volcker","There may be something to [be gained in] a change in the psychological atmosphere that in some sense will give us more bang for the buck.","t1006","for"],["volcker","There is no apparent encore for the Federal Reserve; we will have in effect shot our bolt.","t1006","risk"],["volcker","It has some built-in pressure to move interest rates downward more promptly if the money supply begins running low.","t1006","for"],["wallich","All over the world they would be saying the new procedure really is a form of easing.","t1006","risk"],["volcker","It's an easier political sale.","t1006","for"]],quoteFb:["A sharper break in method might buy credibility that another quarter point could not.","If the new method failed, the Fed would have nothing new to try. Volcker added that he did not think this was necessarily a minus.","The method cuts both ways. That two way flexibility is part of why the September dissenters on both sides could sign on.","Wallich worried that a wide range with a low floor would read abroad as softness, the opposite of the intent.","Rates set by the market, not voted each time, are harder to blame on the Fed. Critics later called this cover; see the contested section."],predict:[["12 to 0, with every voting member backing the new method",!0],["9 to 3, with three doves dissenting against higher rates",!1],["8 to 4, with the September hawks calling it too timid",!1],["7 to 5, with the Board's governors outvoted by presidents",!1]],predictFb:'Unanimous. Rice, the September dove, asked for an even wider range, "9 percent on the low side and 15 to 16 percent on the high side." Coldwell thought the money target too high and said he would not dissent. The Board approved the 12 percent discount rate unanimously.',predictCites:["r1006","t1006","ar79"],calls:[["Switch: target reserves, let the funds rate move 11.5% to 15.5%","maj"],["Stay: keep setting the funds rate, and raise it a full point","alt"],["Wait: hold rates steady and lean on fiscal restraint instead","none"]],callNotes:{alt:'No one voted for this, but it was live. Volcker said he could "go with either of these broad approaches," and the Administration was uneasy about a shift in technique.',none:'No one at the table argued for this. Volcker said the Committee could not "walk away today without a program that is strong in fact and perceived as strong."'},after:"<p>Volcker announced the package at an unusual Saturday evening press conference. The funds rate swung harder than it ever had: 17.6 percent in April 1980, 9 percent by July, 19 percent by January 1981. Credit controls imposed in March 1980 at the Carter Administration's request coincided with a short, sharp recession, and rates fell before rising again. Mortgage rates passed 18 percent in 1981. Builders mailed two by fours to the Fed and auto dealers sent the keys of unsold cars.</p>",afterCites:["frh","moaf","coyne"],events:{21:"October 6: the new method is announced on a Saturday night.",26:"March 1980: credit controls. Inflation peaks at 14.6 percent.",28:"May 1980: recession. The funds rate falls with money demand.",30:"July 1980: the funds rate is down to 9 percent.",36:"January 1981: the funds rate is back above 19 percent.",41:"June 1981: mortgage rates near 17 percent.",44:"Fall 1981: mortgage rates above 18 percent. A second recession.",51:"Spring 1982: unemployment passes 9 percent.",53:"June 1982: inflation is down to 7 percent; unemployment is 9.6 percent."},contest:{q:"What was October 6, really?",positions:[["Real change","A genuine change of operating procedure. Statistical work finds that reserve measures, not the funds rate, best describe Fed policy after 1979.",["bm","lor"]],["Political cover","A way to let rates rise far higher than a committee could vote for openly, while pointing to money growth as the reason.",["greider","t1006"]],["Not yet credible","Markets did not believe it at first. Long rates kept rising, and the real disinflation began only in late 1980 or 1981.",["gk"]]],evidence:[['In the meeting, Volcker said the new technique was "an easier political sale."',1,"This is the core of the cover reading. Supporters reply that political feasibility and real control are not exclusive."],["The funds rate swung from 17.6 to 9 to 19 percent within a year, as reserve targets let it move.",0,"Wild swings in the funds rate are what you expect if the Desk really followed a reserve path rather than a rate."],["Thirty year mortgage rates rose from about 13 to over 18 percent between late 1979 and fall 1981.",2,"Rising long rates suggest markets still expected inflation, the heart of the credibility argument."]]}},{id:"s3",short:"July 1982",date:"June 30 and July 1, 1982",m:54,dm:52,runTo:71,cpiNote:"May",title:"Keep going, or ease?",setting:`<p>Unemployment is 9.5 percent, as reported at the time. Inflation has fallen by half since 1980, to about 7 percent. The funds rate is still above 14 percent. Farm and thrift failures are mounting. In Congress there is talk of credit controls, usury ceilings and a tax on interest.</p>

dibility. A believed commitment would have lowered expectations faster and more cheaply.",["gk"]],["Who paid","The costs fell on builders, farmers, factory towns, thrifts and borrowing countries, not on the economy evenly.",["greider","frh"]]],evidence:[["Inflation fell from 14.6 percent in March 1980 to 2.5 percent by mid 1983 and stayed low.",0,"The size and durability of the fall is the core of the necessary price case."],["Mortgage rates stayed above 13 percent through 1983, long after inflation fell below 4 percent.",1,"High long rates after inflation fell suggest markets still did not trust the Fed, the credibility argument."],["Home builders mailed two by fours and car dealers sent keys to the Fed in protest.",2,"Protests by particular industries speak to where the costs landed."]]}}],Iu=`<h3>What is real</h3>

<h3>What is not modeled</h3>
